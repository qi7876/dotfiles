"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = '''
$username$hostname$directory$git_branch$git_status
$container$character'''

[username]
show_always = true
format = '[$user]($style) '

[hostname]
ssh_only = false
format = 'at [$hostname]($style) '

[directory]
format = 'in [$path]($style)[$read_only]($read_only_style) '
read_only = ' ro'

[git_branch]
format = 'on [$branch]($style) '

[container]
format = '[$name]($style) '
